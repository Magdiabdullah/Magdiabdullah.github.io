<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Blog Connection Test | Magdi Saad</title>

    <link
        rel="stylesheet"
        href="../style.css">

    <style>

        body {
            background: #050806;
            color: #d9e8de;
        }

        .post-wrapper {
            width: min(900px, 92%);
            margin: 60px auto 100px;
        }

        .post-category {
            color: #00ff88;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .post-title {
            color: #ffffff;
            font-size: clamp(32px, 6vw, 56px);
            line-height: 1.1;
            margin: 15px 0;
        }

        .post-meta {
            color: #6f8c7b;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 45px;
        }

        .post-content {
            font-size: 17px;
            line-height: 1.85;
        }

        .post-content p {
            margin-bottom: 22px;
        }

        .post-content figure {
            margin: 35px auto;
            text-align: center;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            border: 1px solid rgba(0,255,140,.15);
        }

        .post-content figcaption {
            margin-top: 10px;
            color: #6f8c7b;
            font-size: 13px;
            font-style: italic;
        }

        .post-content pre {
            background: #020503;
            border: 1px solid rgba(0,255,140,.18);
            border-left: 3px solid #00ff88;
            border-radius: 6px;
            padding: 20px;
            overflow-x: auto;
            color: #9dffca;
            font-family: "Courier New", monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .post-content code {
            font-family: "Courier New", monospace;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            color: #00ff88;
            text-decoration: none;
            font-family: monospace;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <main class="post-wrapper">

        <a
            class="back-link"
            href="../blog.html">
            ← BACK TO SECURITY NOTES
        </a>

        <div class="post-category">
            Web Security
        </div>

        <h1 class="post-title">
            Blog Connection Test
        </h1>

        <div class="post-meta">
            2026-09-20
            
        </div>

        <article class="post-content">

            <p>This is a test of the dynamic blog connection.</p>

        </article>

    </main>

</body>

</html>
